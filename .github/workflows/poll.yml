name: Poll EDGAR

# GitHub cron fires at 5-minute granularity minimum, but five schedules
# offset by one minute give effective ~1-minute polling. Runs may lag a
# few minutes under load — the poll endpoint is idempotent, overlap is free.
on:
  schedule:
    - cron: "0-59/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-edgar
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://insider-tracker-three.vercel.app/api/cron/poll
