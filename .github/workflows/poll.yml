name: Poll EDGAR

# Every 30 minutes. On a PRIVATE repo, GitHub Actions minutes are metered
# (~2,000 free/month), so we can't poll every minute here — 48 runs/day keeps
# well under budget. Filings carry a ~2-day legal reporting lag, so 30-minute
# freshness is effectively the same as 1-minute for this data. The endpoint is
# idempotent, and the daily Vercel cron is a second self-healing backstop.
# (Want true ~1-min again? Move this curl to a tiny PUBLIC pinger repo, where
# Actions is unlimited — no app code lives there, so privacy is preserved.)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-edgar
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        run: |
          curl -fsS --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://insider-tracker-three.vercel.app/api/cron/poll
